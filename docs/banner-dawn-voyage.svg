<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 200">
  <defs>
    <linearGradient id="bgDawn" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#0a1220"/>
      <stop offset="48%" style="stop-color:#27435e"/>
      <stop offset="68%" style="stop-color:#8a7a68"/>
      <stop offset="78%" style="stop-color:#d9a86c"/>
      <stop offset="82%" style="stop-color:#1a2a3d"/>
      <stop offset="100%" style="stop-color:#070d16"/>
    </linearGradient>
    <radialGradient id="sunDawn" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#FFE3B0" stop-opacity="0.95"/>
      <stop offset="45%" style="stop-color:#E8B573" stop-opacity="0.35"/>
      <stop offset="100%" style="stop-color:#E8B573" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="textDawn" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#FFF4E0">
        <animate attributeName="stop-color" values="#FFF4E0;#E8D9BE;#FFF4E0" dur="6s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" style="stop-color:#C9D6DF">
        <animate attributeName="stop-color" values="#C9D6DF;#FFF4E0;#C9D6DF" dur="6s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>
    <filter id="glowDawn" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="seaDawn"><rect x="0" y="132" width="800" height="68" rx="0"/></clipPath>
  </defs>

  <rect width="800" height="200" fill="url(#bgDawn)" rx="16"/>

  <!-- early stars fading -->
  <g fill="#E8EEF3">
    <circle cx="120" cy="28" r="1.3" opacity="0.5"><animate attributeName="opacity" values="0.5;0.08;0.5" dur="4s" repeatCount="indefinite"/></circle>
    <circle cx="250" cy="46" r="1" opacity="0.35"><animate attributeName="opacity" values="0.35;0.06;0.35" dur="5s" repeatCount="indefinite"/></circle>
    <circle cx="620" cy="26" r="1.3" opacity="0.5"><animate attributeName="opacity" values="0.5;0.08;0.5" dur="4.4s" repeatCount="indefinite"/></circle>
    <circle cx="710" cy="50" r="1" opacity="0.35"><animate attributeName="opacity" values="0.35;0.06;0.35" dur="5.4s" repeatCount="indefinite"/></circle>
  </g>

  <!-- low sun on horizon -->
  <circle cx="400" cy="128" r="52" fill="url(#sunDawn)" opacity="0.9">
    <animate attributeName="opacity" values="0.9;0.65;0.9" dur="5s" repeatCount="indefinite"/>
  </circle>
  <circle cx="400" cy="128" r="13" fill="#FFF1D2" opacity="0.95" filter="url(#glowDawn)"/>
  <line x1="40" y1="130" x2="760" y2="130" stroke="#FFE3B0" stroke-width="1" opacity="0.5"/>

  <!-- distant ship drifting -->
  <g opacity="0.9">
    <animateTransform attributeName="transform" type="translate" values="0 0; 18 0; 0 0" dur="18s" repeatCount="indefinite"/>
    <polygon points="250,124 310,124 300,132 260,132" fill="#0a1220"/>
    <line x1="268" y1="124" x2="268" y2="100" stroke="#0a1220" stroke-width="2"/>
    <line x1="290" y1="124" x2="290" y2="104" stroke="#0a1220" stroke-width="2"/>
    <polygon points="268,100 268,122 250,122" fill="#0a1220" opacity="0.85"/>
    <polygon points="290,104 290,122 306,122" fill="#0a1220" opacity="0.85"/>
  </g>

  <!-- gulls -->
  <g stroke="#0a1220" stroke-width="1.4" fill="none" opacity="0.7">
    <g>
      <path d="M480 60 Q 485 55 490 60 Q 495 55 500 60"/>
      <animateTransform attributeName="transform" type="translate" values="0 0; 30 -6; 0 0" dur="9s" repeatCount="indefinite"/>
    </g>
    <g>
      <path d="M520 44 Q 524 40 528 44 Q 532 40 536 44"/>
      <animateTransform attributeName="transform" type="translate" values="0 0; 24 -8; 0 0" dur="11s" repeatCount="indefinite"/>
    </g>
    <g>
      <path d="M240 52 Q 244 48 248 52 Q 252 48 256 52"/>
      <animateTransform attributeName="transform" type="translate" values="0 0; -24 -6; 0 0" dur="10s" repeatCount="indefinite"/>
    </g>
  </g>

  <!-- foreground sea -->
  <g clip-path="url(#seaDawn)">
    <rect x="0" y="132" width="800" height="68" fill="#070d16" opacity="0.88"/>
    <line x1="340" y1="142" x2="460" y2="142" stroke="#FFE3B0" stroke-width="2" opacity="0.5">
      <animate attributeName="opacity" values="0.5;0.2;0.5" dur="3s" repeatCount="indefinite"/>
    </line>
    <line x1="320" y1="156" x2="480" y2="156" stroke="#E8B573" stroke-width="2.5" opacity="0.4">
      <animate attributeName="opacity" values="0.4;0.15;0.4" dur="3.8s" repeatCount="indefinite"/>
    </line>
    <path d="M-100 148 Q -50 142 0 148 T 100 148 T 200 148 T 300 148 T 400 148 T 500 148 T 600 148 T 700 148 T 800 148 T 900 148" stroke="#5b7a93" stroke-width="1.3" fill="none" opacity="0.5">
      <animateTransform attributeName="transform" type="translate" values="0 0; -100 0; 0 0" dur="9s" repeatCount="indefinite"/>
    </path>
    <path d="M-100 168 Q -50 162 0 168 T 100 168 T 200 168 T 300 168 T 400 168 T 500 168 T 600 168 T 700 168 T 800 168 T 900 168" stroke="#3d5266" stroke-width="1.1" fill="none" opacity="0.5">
      <animateTransform attributeName="transform" type="translate" values="-100 0; 0 0; -100 0" dur="11s" repeatCount="indefinite"/>
    </path>
  </g>

  <!-- text -->
  <text x="400" y="52" text-anchor="middle" font-family="Georgia, serif" font-size="38" font-weight="bold" fill="url(#textDawn)" filter="url(#glowDawn)">⚓ Aphros | New Tab</text>
  <text x="400" y="74" text-anchor="middle" font-family="Georgia, serif" font-style="italic" font-size="13.5" fill="#E8D9BE">Dawn through grey clouds — another voyage begins.</text>
</svg>
